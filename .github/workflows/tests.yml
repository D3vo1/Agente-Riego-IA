name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas del agente (FastAPI)
        run: pytest -q
      - name: Pruebas del servicio de gestion (Django)
        working-directory: management_service
        run: python manage.py test core
