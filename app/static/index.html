<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroRiego IA</title>
  <style>
    :root { color-scheme: light; --green: #166534; --light: #f0fdf4; --line: #bbf7d0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #172033; }
    main { max-width: 780px; min-height: 100vh; margin: auto; padding: 32px 18px; }
    header { background: linear-gradient(135deg, #14532d, #16a34a); color: white; padding: 24px; border-radius: 18px 18px 0 0; }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    header p { margin: 0; opacity: .9; }
    #messages { height: 430px; overflow-y: auto; padding: 20px; background: white; border: 1px solid var(--line); }
    .message { max-width: 82%; margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.45; }
    .agent { background: var(--light); border: 1px solid var(--line); }
    .user { margin-left: auto; background: var(--green); color: white; }
    form { display: flex; gap: 10px; padding: 14px; background: white; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #94a3b8; border-radius: 10px; font-size: 1rem; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: var(--green); color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    footer { margin-top: 12px; color: #64748b; font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🌱 AgroRiego IA</h1>
      <p>Asistente conversacional para orientación sobre riego inteligente</p>
    </header>
    <section id="messages" aria-live="polite">
      <div class="message agent">Hola. Puedo orientarte sobre humedad, horarios y sistemas de riego. ¿Qué cultivo deseas revisar?</div>
    </section>
    <form id="chat-form">
      <input id="message" maxlength="2000" autocomplete="off" placeholder="Escribe tu pregunta..." required>
      <button id="send" type="submit">Enviar</button>
    </form>
    <footer>Prototipo académico · No controla equipos ni consulta sensores reales</footer>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    const sessionId = localStorage.getItem('agroRiegoSession') || crypto.randomUUID();
    localStorage.setItem('agroRiegoSession', sessionId);

    function addMessage(text, role) {
      const item = document.createElement('div');
      item.className = `message ${role}`;
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, 'user');
      input.value = '';
      send.disabled = true;
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message, session_id: sessionId})
        });
        const data = await response.json();
        addMessage(response.ok ? data.answer : `Error: ${data.detail}`, 'agent');
      } catch (_) {
        addMessage('No se pudo conectar con el servidor.', 'agent');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
